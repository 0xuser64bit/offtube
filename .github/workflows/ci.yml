name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Validate backend, media encoding and clients
        env:
          PYTHON: python
        run: bash tools/check.sh
      - name: Start and stop offtube with run.sh
        run: bash tools/launcher_smoke.sh
      - name: Check the README's systemd unit
        run: |
          sed "s|REPLACE_DIR|$PWD|g" deploy/offtube.service > "$RUNNER_TEMP/offtube.service"
          systemd-analyze --user verify "$RUNNER_TEMP/offtube.service"

  windows:
    # Process groups, taskkill tree stops and the exclusive port bind only
    # exist here; POSIX-only tests skip themselves.
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          choco install ffmpeg --no-progress --yes
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run the backend tests on Windows
        run: python -m pytest tests -q -rs
      - name: Start offtube with run.bat
        run: |
          # run.bat builds its venv on first run, then starts offtube.
          $env:PORT = "18123"
          $server = Start-Process cmd.exe -ArgumentList "/c", "run.bat" -NoNewWindow -PassThru `
            -RedirectStandardOutput launcher.out -RedirectStandardError launcher.err
          $up = $false
          for ($i = 0; $i -lt 180 -and -not $up; $i++) {
            try {
              Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:18123/api/health" -TimeoutSec 2 | Out-Null
              $up = $true
            } catch {
              if ($server.HasExited) { break }
              Start-Sleep -Seconds 1
            }
          }
          taskkill /PID $server.Id /T /F | Out-Null
          Get-Content launcher.out, launcher.err
          if (-not $up) { throw "run.bat never got offtube answering /api/health" }
          exit 0

  macos:
    # launchd service mode makes macOS a supported host: its process groups
    # and paths (/var is /private/var) differ from Linux in small ways.
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install ffmpeg deno
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run the backend tests on macOS
        run: python -m pytest tests -q -rs
      - name: Start and stop offtube with run.sh
        run: bash tools/launcher_smoke.sh
      - name: Run offtube as the README's launchd agent
        run: |
          # The README's install commands, then the tools must be found:
          # launchd's own PATH has no Homebrew.
          mkdir -p ~/Library/LaunchAgents ~/Library/Logs
          DIR="$(pwd)"
          sed -e "s|REPLACE_ME|$USER|g" -e "s|REPLACE_DIR|$DIR|g" \
            deploy/com.offtube.plist > ~/Library/LaunchAgents/com.offtube.plist
          plutil -lint ~/Library/LaunchAgents/com.offtube.plist
          launchctl load ~/Library/LaunchAgents/com.offtube.plist
          trap 'launchctl unload ~/Library/LaunchAgents/com.offtube.plist || true; cat ~/Library/Logs/offtube.log || true' EXIT
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8000/api/health -o health.json 2>/dev/null; then break; fi
            sleep 1
          done
          cat health.json
          python -c "import json, sys; c = json.load(open('health.json'))['checks']; sys.exit(0 if c['ffmpeg'] and c['js_runtime_ok'] else 'ffmpeg or a JS runtime is missing under launchd')"

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Install the server, Chromium and axe-core
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/browser" playwright@1.63.0 axe-core@4.14.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise the web desk and the extension in Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/browser/node_modules
          OFFTUBE_BROWSER_TESTS: required
          PYTHON: python
        run: node --test tests/browser/desk.test.mjs tests/browser/extension.test.mjs

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build runtime image
        run: docker build --tag offtube:ci .
      - name: Check packaged yt-dlp worker
        run: docker run --rm --entrypoint python offtube:ci -m py_compile app.py tools/ytdlp_worker.py
      - name: Check HTTP startup
        run: |
          docker run --detach --name offtube-ci --publish 127.0.0.1:18000:8000 offtube:ci
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 1 --retry-all-errors --retry-max-time 30 \
            --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:18000/api/health
      - name: Check child reaping and graceful stop
        run: |
          # An orphan is reparented to PID 1, which must reap it.
          docker exec offtube-ci sh -c 'sleep 1 & exit 0'
          sleep 2
          zombies=$(docker exec offtube-ci sh -c 'cat /proc/[0-9]*/stat 2>/dev/null; true' \
            | sed 's/.*) //' | awk '$1 == "Z"' | wc -l)
          test "$zombies" -eq 0
          # SIGTERM must stop offtube cleanly, well before the SIGKILL timeout.
          docker stop --time 10 offtube-ci
          test "$(docker inspect --format '{{.State.ExitCode}}' offtube-ci)" -eq 0
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs offtube-ci || true
          docker rm --force offtube-ci || true
