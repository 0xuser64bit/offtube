<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>offtube</title>
  <link rel="stylesheet" href="../ui.css" />
</head>
<body class="popup">
  <p id="announce" class="visually-hidden" role="status"></p>
  <svg class="visually-hidden" aria-hidden="true" focusable="false"><filter id="wax" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="grain"/><feDisplacementMap in="SourceGraphic" in2="grain" scale="1.4" xChannelSelector="R" yChannelSelector="G"/></filter></svg>

  <header class="head">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" class="brand-rebate"/><rect x="2" y="2.5" width="2.6" height="3.5" rx=".7" class="brand-perf"/><rect x="2" y="8.5" width="2.6" height="3.5" rx=".7" class="brand-perf"/><rect x="2" y="14.25" width="2.6" height="3.5" rx=".7" class="brand-perf"/><rect x="2" y="20" width="2.6" height="3.5" rx=".7" class="brand-perf"/><rect x="2" y="26" width="2.6" height="3.5" rx=".7" class="brand-perf"/><rect x="27.4" y="2.5" width="2.6" height="3.5" rx=".7" class="brand-perf"/><rect x="27.4" y="8.5" width="2.6" height="3.5" rx=".7" class="brand-perf"/><rect x="27.4" y="14.25" width="2.6" height="3.5" rx=".7" class="brand-perf"/><rect x="27.4" y="20" width="2.6" height="3.5" rx=".7" class="brand-perf"/><rect x="27.4" y="26" width="2.6" height="3.5" rx=".7" class="brand-perf"/><rect x="7" y="2.5" width="18" height="12" class="brand-window"/><rect x="7" y="17.5" width="18" height="12" class="brand-window"/><path d="M12 23.3c1.2.9 2.2 2.1 3.1 3.5 2.4-4 5-7 8.7-9.7" class="brand-tick"/></svg>
      <span class="brand-name">offtube</span>
    </div>
    <p id="health" class="health" role="status"><i aria-hidden="true"></i><span id="healthText">Checking…</span></p>
  </header>

  <main>
    <div id="stage"></div>
    <p class="print-tools hidden" id="sheetTools"><span class="count" id="markCount"></span><button class="text-btn" type="button" id="pickInPanel">More in the side panel</button></p>

    <div id="problem" class="problem hidden" role="alert">
      <svg class="mark mark-strike" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M14 18C38 40 62 62 88 84M86 16C62 40 38 62 14 86"/></svg>
      <div>
        <p class="problem-text" id="problemText"></p>
        <button class="text-btn hidden" type="button" id="problemFix">Use my browser’s sign-in</button>
      </div>
    </div>

    <fieldset class="chips" id="qualities" aria-label="Format"></fieldset>
    <div id="gifOptions" class="hidden"></div>

    <div class="keep-actions">
      <button id="dlBtn" class="keep-btn" type="button" disabled>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v7.5M4.5 6.5 8 10l3.5-3.5M2.5 13.5h11"/></svg>
        <span id="dlLabel">Keep</span>
      </button>
      <button id="cancelBtn" class="btn btn-quiet hidden" type="button">Cancel</button>
    </div>

    <div class="deck">
      <div class="meter" id="meter" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
      <p class="deck-line"><span id="jobStatus">Kept files land in downloads/ on this machine.</span><span class="deck-pct num" id="jobPct"></span></p>
    </div>

    <div id="gifResult" class="gif-result hidden" aria-live="polite"></div>

    <div class="access-row">
      <label class="label" for="access">Sign-in</label>
      <select id="access">
        <option value="none">Not needed</option>
        <option value="browser" id="accessBrowser">Use my browser’s cookies</option>
        <option value="upload">Cookies file (in the side panel)</option>
      </select>
    </div>

    <div class="link-row" id="linkRow"><span class="link-text" id="linkText"></span><button class="text-btn" type="button" id="changeLink">Change</button></div>
    <form class="link-edit hidden" id="linkForm" autocomplete="off">
      <label class="visually-hidden" for="url">Link to keep</label>
      <input id="url" type="url" inputmode="url" spellcheck="false" placeholder="Paste a link" />
      <button type="submit">Preview</button>
    </form>

    <div class="foot-links">
      <button class="text-btn" type="button" id="openPanel">Open side panel</button>
      <button class="text-btn" type="button" id="openLib">Open library</button>
    </div>
  </main>

  <script src="../shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
